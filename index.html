<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Picture Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden text-center p-6 space-y-6">
        
        <div>
            <h1 class="text-2xl font-bold text-white tracking-wide">โปรไฟล์</h1>
            <p class="text-xs text-slate-400 mt-1">OnchumaBoonmatoon / onchuma-aa</p>
        </div>

        <div class="relative group w-48 h-48 mx-auto">
            <div class="absolute -inset-1 bg-gradient-to-r from-pink-500 to-indigo-500 rounded-full blur opacity-75 group-hover:opacity-100 transition duration-300"></div>
            <div class="relative w-full h-full rounded-full overflow-hidden border-4 border-slate-800 bg-slate-900 flex items-center justify-center">
                <img 
                    id="profileImg"
                    src="https://raw.githubusercontent.com/OnchumaBoonmatoon/onchuma-aa/main/1787213535183.jpg" 
                    alt="Profile Picture" 
                    class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                    onerror="handleImageError()"
                />
            </div>
        </div>

        <div id="statusMessage" class="hidden text-sm px-4 py-2 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400">
            ไม่สามารถโหลดรูปภาพได้ กรุณาตรวจสอบลิงก์อีกครั้ง
        </div>

        <div class="flex flex-col gap-3 pt-2">
            <a 
                href="https://github.com/OnchumaBoonmatoon/onchuma-aa/blob/main/1787213535183.jpg" 
                target="_blank" 
                rel="noopener noreferrer"
                class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2"
            >
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                ดูไฟล์ต้นฉบับบน GitHub
            </a>

            <button 
                onclick="copyLink()"
                class="w-full py-2.5 px-4 bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium rounded-xl transition duration-200 flex items-center justify-center gap-2"
            >
                <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                <span id="copyText">คัดลอกลิงก์รูปภาพ (Raw)</span>
            </button>
        </div>
    </div>

    <script>
        function handleImageError() {
            const statusMsg = document.getElementById('statusMessage');
            statusMsg.classList.remove('hidden');
        }

        function copyLink() {
            const rawUrl = 'https://raw.githubusercontent.com/OnchumaBoonmatoon/onchuma-aa/main/1787213535183.jpg';
            
            // Fallback for copy command in iframe environment
            const tempInput = document.createElement('input');
            tempInput.value = rawUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            const copyText = document.getElementById('copyText');
            copyText.textContent = 'คัดลอกเรียบร้อยแล้ว!';
            setTimeout(() => {
                copyText.textContent = 'คัดลอกลิงก์รูปภาพ (Raw)';
            }, 2000);
        }
    </script>
</body>
</html>
